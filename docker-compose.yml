services:
  db:
    image: pgvector/pgvector:pg16
    container_name: crm-agent-db
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm_secret
      POSTGRES_DB: crm_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
